# Bygger ClaudeUsage.exe vid push och PR mot main, så att ett trasigt bygge syns direkt.
# Återanvänds av release.yml, så att en release byggs på exakt samma sätt.
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Check that the app imports
        run: python -c "import claude_usage_tray as m; print('Claude Usage', m.__version__)"

      # Versionsinformationen skapas från __version__, så att den aldrig hamnar ur synk
      - name: Write version info
        run: python scripts/make_version_info.py build/version_info.txt

      # --noupx: exe-filer packade med UPX flaggas oftare av antivirusprogram. PyInstaller använder bara
      # UPX om det är installerat, vilket det inte är på GitHubs byggmaskiner, så här ändrar flaggan
      # ingenting i dag. Den är ett skydd för lokala bygg och om UPX någon gång skulle finnas här.
      - name: Build exe
        run: pyinstaller --noconfirm --onefile --noconsole --noupx --name ClaudeUsage --icon assets/icon.ico --version-file build/version_info.txt claude_usage_tray.py

      - name: Check the version info in the exe
        shell: pwsh
        run: |
          $expected = python -c "import claude_usage_tray as m; print(m.__version__)"
          $info = (Get-Item dist/ClaudeUsage.exe).VersionInfo
          Write-Output "ProductName=$($info.ProductName) ProductVersion=$($info.ProductVersion) FileVersion=$($info.FileVersion)"
          if ($info.ProductName -ne "Claude Usage" -or $info.ProductVersion -ne $expected -or $info.FileVersion -ne $expected) {
            Write-Error "The version info in ClaudeUsage.exe does not match __version__ $expected"
            exit 1
          }

      - uses: actions/upload-artifact@v7
        with:
          name: ClaudeUsage
          path: dist/ClaudeUsage.exe
          if-no-files-found: error
          retention-days: 7
